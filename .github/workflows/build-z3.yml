name: Build Z3 Solver
run-name: "Build Z3 ${{ inputs.z3_version }}"

## Builds Z3 from source for Linux and macOS and publishes each binary
## as a GitHub release asset.  Z3 version is parameterised.
##
## Trigger manually via the GitHub UI or:
##   gh workflow run build-z3.yml --repo OpenJML/Solvers --ref master --field z3_version=<version>
## The build-z3 convenience script wraps this call.
## For Windows binaries use build-win.yml / build-win convenience script.
##
## Matrix:
##   ubuntu-arm64      — ubuntu-24.04-arm runner, ubuntu:24.04 container (GCC 13)
##   ubuntu-x86_64     — ubuntu-24.04     runner, ubuntu:24.04 container (GCC 13)
##   macos-14-arm64    — macos-14 runner, Apple Clang, deployment target 14
##   macos-14-x86_64   — macos-14 runner, Apple Clang via arch -x86_64, deployment target 14
##   macos-15-arm64    — macos-15 runner, Apple Clang, deployment target 15
##   macos-15-x86_64   — macos-15 runner, Apple Clang via arch -x86_64, deployment target 15
##
## Each macOS binary is built with -mmacosx-version-min matching its runner so
## the deployment target is embedded in the binary and the asset name reflects it.
##
## ubuntu:24.04 (GCC 13) is used for all Linux jobs.  GCC 13 provides the
## C++20 <format> and <span> headers required by z3 >= ~4.12.  Older z3
## (4.3.x) has C++ violations that strict GCC rejects, but -fpermissive
## downgrades these to warnings just as macOS Apple Clang does.
## Newer z3 (detected by #include <span> in the source) uses CMake; older
## z3 uses the Python mk_make.py build system.
##
## A single release is created once by the 'prepare' job; every platform's
## binary is uploaded to that same release.  The tag is based on the Z3
## version and a UTC timestamp so each workflow run produces a new release.

on:
  workflow_dispatch:
    inputs:
      z3_version:
        description: 'Z3 version tag to build (e.g. 4.8.12, 4.16.0)'
        required: true

permissions:
  contents: write

jobs:

  ## ── Create the shared GitHub release ─────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag:       ${{ steps.rel.outputs.tag }}
      title:     ${{ steps.rel.outputs.title }}
      z3_version: ${{ steps.rel.outputs.z3_version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Create release
      id: rel
      run: |
        ## The resolved version is exposed as an output so build-z3 can
        ## reference it via needs.prepare.outputs.z3_version — avoiding
        ## the job env: context where 'env' named-value is not available.
        ver="${{ inputs.z3_version }}"
        ts=$(date -u +%Y%m%d-%H%M%S)
        tag="z3-${ver}-${ts}"
        title="Z3 ${ver} — $(date -u '+%Y-%m-%d %H:%M UTC')"
        echo "z3_version=$ver" >> "$GITHUB_OUTPUT"
        echo "tag=$tag"        >> "$GITHUB_OUTPUT"
        echo "title=$title"    >> "$GITHUB_OUTPUT"
        ## Create as a draft so it is invisible until all builds succeed.
        ## The 'finalize' job publishes it once every platform has uploaded.
        gh release create "$tag" \
          --repo "${{ github.repository }}" \
          --title "$title" \
          --draft \
          --notes "Z3 ${ver} binaries for ubuntu-arm64, ubuntu-x86_64, macos-14-arm64, macos-14-x86_64, macos-15-arm64, macos-15-x86_64. Built from https://github.com/Z3Prover/z3/releases/tag/z3-${ver}."

  ## ── Build matrix ─────────────────────────────────────────────────────────
  build-z3:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner:    ubuntu-24.04-arm
            label:     ubuntu-24.04-arm64
            container: ubuntu:24.04
            arch_cmd:  ''
          - runner:    ubuntu-24.04
            label:     ubuntu-24.04-x86_64
            container: ubuntu:24.04
            arch_cmd:  ''
          - runner:       macos-14
            label:        macos-14-arm64
            container:    ''
            arch_cmd:     ''
            macos_target: '14'
          - runner:       macos-14
            label:        macos-14-x86_64
            container:    ''
            arch_cmd:     'arch -x86_64'
            macos_target: '14'
          - runner:       macos-15
            label:        macos-15-arm64
            container:    ''
            arch_cmd:     ''
            macos_target: '15'
          - runner:       macos-15
            label:        macos-15-x86_64
            container:    ''
            arch_cmd:     'arch -x86_64'
            macos_target: '15'

    runs-on: ${{ matrix.runner }}

    ## The container field runs all steps inside the named Docker image rather
    ## than directly on the runner.  For Linux jobs, ubuntu:24.04 provides GCC 13
    ## which supports the C++20 <format> and <span> headers required by newer z3.
    ## The runner supplies the CPU architecture and Docker engine; the container
    ## supplies the compiler and libraries.  The resulting binary targets the
    ## container's architecture natively — no cross-compilation or emulation.
    ## For macOS jobs, container is '' (empty string), which GitHub Actions
    ## treats as "no container": steps run directly on the macOS runner using
    ## Xcode/Apple Clang.  macOS runners cannot run Linux Docker containers.
    container: ${{ matrix.container }}

    env:
      Z3_VERSION: ${{ needs.prepare.outputs.z3_version }}
      OS_LABEL:   ${{ matrix.label }}

    defaults:
      run:
        shell: bash

    steps:
    ## ── Metadata ───────────────────────────────────────────────────────────
    - name: Set build metadata
      id: meta
      run: |
        ver="${{ env.Z3_VERSION }}"
        os="${{ env.OS_LABEL }}"
        echo "asset_name=z3-${ver}-${os}" >> "$GITHUB_OUTPUT"

    ## ── Dependencies ───────────────────────────────────────────────────────
    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          python3 python3-setuptools 2to3 build-essential cmake curl ca-certificates jq file
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
          > /etc/apt/sources.list.d/github-cli.list
        apt-get update -qq
        apt-get install -y gh

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        ## Xcode command-line tools and cmake are pre-installed; ensure gh is available.
        brew install gh || true
        ## 2to3 ships with Python 3 on macOS.
        which 2to3 || pip3 install 2to3 || true
        ## setuptools provides distutils, which was removed from the Python stdlib
        ## in 3.12.  Z3 4.8.x build scripts reference distutils directly.
        ## --break-system-packages is required on Python 3.12+ macOS runners.
        pip3 install --break-system-packages setuptools 2>/dev/null \
          || pip3 install setuptools || true

    ## ── Source ─────────────────────────────────────────────────────────────
    - name: Download Z3 source
      run: |
        curl -fsSL "https://github.com/Z3Prover/z3/archive/refs/tags/z3-${{ env.Z3_VERSION }}.tar.gz" \
             | tar xz
        echo "Source directory: $(ls -d z3-z3-*/)"

    ## ── Patch ──────────────────────────────────────────────────────────────
    - name: Patch Z3 source for Python 3 and platform compatibility
      run: |
        cd "z3-z3-${{ env.Z3_VERSION }}"

        ## 0. Strip Windows SAL annotation macros (__in, __out, __inout).
        ##    On Linux these expand to empty but conflict with GCC STL variable
        ##    names (stl_algo.h uses __in as a loop variable).  On macOS they
        ##    also expand to nothing and are harmless to remove.  Semantically
        ##    neutral since they always expand to nothing on non-MSVC compilers.
        python3 -c "
        import os, pathlib, re
        count = 0
        sal_names = ('__in', '__out', '__inout')

        def strip_sal(t):
            for name in sal_names:
                block = '#ifndef %s\n#define %s\n#endif' % (name, name)
                t = t.replace(block + '\n', '').replace(block, '')
            lines = t.splitlines(keepends=True)
            new_lines = []
            for line in lines:
                s = line.lstrip()
                if s.startswith('#undef') or s.startswith('#ifndef') or s.startswith('#ifdef'):
                    new_lines.append(line)
                elif s.startswith('#define'):
                    m = re.match(r'([ \t]*#define[ \t]+\w+(?:\([^)]*\))?)(.*)', line, re.DOTALL)
                    if m:
                        prefix, body = m.group(1), m.group(2)
                        for name in sal_names:
                            body = re.sub(r'\b' + re.escape(name) + r'\b', '', body)
                        new_lines.append(prefix + body)
                    else:
                        new_lines.append(line)
                else:
                    for name in sal_names:
                        line = re.sub(r'\b' + re.escape(name) + r'\b', '', line)
                    new_lines.append(line)
            return ''.join(new_lines)

        for root, dirs, files in os.walk('src'):
            for fname in files:
                if not fname.endswith(('.h', '.cpp', '.cc', '.c')):
                    continue
                p = pathlib.Path(root, fname)
                try:
                    t = p.read_text(errors='replace')
                except Exception:
                    continue
                new_t = strip_sal(t)
                if new_t != t:
                    p.write_text(new_t)
                    count += 1
        print(f'Stripped SAL annotations from {count} file(s)')
        "

        ## 1a. Replace distutils.sysconfig (removed in Python 3.12) with sysconfig.
        ##     Uses regex so it matches get_python_lib(...) with any arguments —
        ##     Z3 4.8.x calls get_python_lib(prefix=getenv("PREFIX", None))
        ##     which the simple string-replace approach misses.
        python3 -c "
        import pathlib, re
        p = pathlib.Path('scripts/mk_util.py')
        t = p.read_text(errors='replace')
        t = t.replace('import distutils.sysconfig',
                      'import sysconfig as _sysconfig_mod')
        t = re.sub(r'distutils\.sysconfig\.get_python_lib\((?:[^()]*|\([^()]*\))*\)',
                   '_sysconfig_mod.get_path(\"purelib\")', t)
        t = re.sub(r'distutils\.sysconfig\.get_python_version\(\)',
                   '_sysconfig_mod.get_python_version()', t)
        p.write_text(t)
        print('Patched distutils.sysconfig in mk_util.py')
        "

        ## 1. Convert Python 2 syntax; fix tab/space mixing.
        ## Run 2to3 only if it can parse scripts/mk_make.py (i.e., it is Python 2).
        ## z3 >= 4.8 already uses Python 3 syntax (f-strings etc.) that 2to3's
        ## Python-2 parser cannot read.  If we let 2to3 run and fail mid-way it
        ## leaves partially-converted files that cause SyntaxErrors downstream.
        ## Using mk_make.py as a canary avoids that: if 2to3 exits 1 on it the
        ## whole set of scripts is already Python 3 and needs no conversion.
        if 2to3 scripts/mk_make.py > /dev/null 2>&1; then
            2to3 -w scripts/ src/api/python/ > /dev/null 2>&1 || true
            find scripts/ src/api/python/ -name '*.bak' -delete 2>/dev/null || true
            for f in scripts/*.py src/api/python/*.py; do
                [ -f "$f" ] && { expand -t 8 "$f" > /tmp/pf && mv /tmp/pf "$f"; } || true
            done
        fi

        ## 2. Skip Makefile targets that are incompatible with Linux/macOS builds.
        python3 -c "
        import pathlib
        p = pathlib.Path('scripts/mk_make.py')
        t = p.read_text()
        for skip in ['check_eol()', 'mk_vs_proj(']:
            t = '\n'.join(
                ('# ' + l if l.strip().startswith(skip.split('(')[0]) else l)
                for l in t.splitlines()
            )
        p.write_text(t)
        "

        ## 3. Fix sorted(cnames, cmp=...) missed by 2to3.
        python3 -c "
        import pathlib
        p = pathlib.Path('scripts/mk_util.py')
        t = p.read_text()
        t = t.replace(
            'return sorted(cnames, cmp=comp_components)',
            'import functools; return sorted(cnames, key=functools.cmp_to_key(comp_components))'
        )
        p.write_text(t)
        "

        ## 4. ARM64: create emmintrin.h stub (SSE2 header absent on ARM).
        ##    On x86_64 (Linux and macOS) emmintrin.h exists natively.
        arch=$(uname -m)
        if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
            mkdir -p /tmp/stub_includes
            printf '%s\n' \
              '#pragma once' \
              '/* ARM64 stub for x86 SSE2 scalar-double intrinsics */' \
              '#include <fenv.h>' \
              '#include <math.h>' \
              'typedef double __m128d;' \
              'static inline __m128d _mm_set_sd(double d){return d;}' \
              'static inline void _mm_store_sd(double*p,__m128d m){*p=m;}' \
              'static inline __m128d _mm_add_sd(__m128d a,__m128d b){return a+b;}' \
              'static inline __m128d _mm_sub_sd(__m128d a,__m128d b){return a-b;}' \
              'static inline __m128d _mm_mul_sd(__m128d a,__m128d b){return a*b;}' \
              'static inline __m128d _mm_div_sd(__m128d a,__m128d b){return a/b;}' \
              'static inline __m128d _mm_sqrt_pd(__m128d a){return sqrt(a);}' \
              'static inline __m128d _mm_max_sd(__m128d a,__m128d b){return(a>b)?a:b;}' \
              'static inline __m128d _mm_min_sd(__m128d a,__m128d b){return(a<b)?a:b;}' \
              '#define _MM_ROUND_NEAREST     FE_TONEAREST' \
              '#define _MM_ROUND_DOWN        FE_DOWNWARD' \
              '#define _MM_ROUND_UP          FE_UPWARD' \
              '#define _MM_ROUND_TOWARD_ZERO FE_TOWARDZERO' \
              '#define _MM_SET_ROUNDING_MODE(x) fesetround(x)' \
              > /tmp/stub_includes/emmintrin.h
            ## Also install to /usr/local/include so the compiler finds it without any -I flag.
            ## This is necessary for Z3 4.3.2 where the generated build/config.mk
            ## may not propagate our custom -I flag into every compilation command.
            ## Linux containers run as root (plain mkdir/cp); macOS runners are non-root (sudo required).
            if [ "$(id -u)" = "0" ]; then
                mkdir -p /usr/local/include
                cp /tmp/stub_includes/emmintrin.h /usr/local/include/emmintrin.h
            else
                sudo mkdir -p /usr/local/include
                sudo cp /tmp/stub_includes/emmintrin.h /usr/local/include/emmintrin.h
            fi
            echo "Created ARM64 emmintrin.h stub (also installed to /usr/local/include/)"
            STUB_INC="-I/tmp/stub_includes"
        else
            STUB_INC=""
        fi

        ## 5. Linux: cast UINT64_MAX to resolve overload ambiguity.
        ##    On Linux (both x86_64 and arm64), UINT64_MAX is 'unsigned long'
        ##    but Z3's uint64 = 'unsigned long long' — both 64-bit but distinct
        ##    types, creating ambiguous set(mpz&, ...) overloads.
        if [ "$(uname)" = "Linux" ]; then
            python3 -c "
        import pathlib
        p = pathlib.Path('src/util/mpz.cpp')
        t = p.read_text(errors='replace')
        t = t.replace('set(m_two64, UINT64_MAX)', 'set(m_two64, (uint64)UINT64_MAX)')
        p.write_text(t)
        print('Patched UINT64_MAX cast in mpz.cpp')
            "
        fi

        ## 5b. Fix template-body bugs in z3 4.8.x LP math headers.
        ##     static_matrix.h:83 calls .get() which doesn't exist; should be .get_elem().
        ##     tail_matrix.h: ref_row::operator[] calls m_A.get_elem() but tail_matrix has
        ##     no get_elem without Z3DEBUG. Replace with return T(); using a block comment
        ##     so the closing } on the same source line is not accidentally commented out.
        python3 -c "
        import pathlib
        # static_matrix.h:83 calls .get() which doesn't exist — fix to .get_elem()
        p = pathlib.Path('src/math/lp/static_matrix.h')
        if p.exists():
            t = p.read_text(errors='replace')
            new_t = t.replace('v.m_matrix.get(v.m_row, v.m_col)',
                              'v.m_matrix.get_elem(v.m_row, v.m_col)')
            if new_t != t:
                p.write_text(new_t)
                print('Fixed static_matrix.h .get() -> .get_elem()')
        # tail_matrix.h: ref_row::operator[] calls m_A.get_elem() but tail_matrix has
        # no get_elem (only matrix<T,X> does, via #ifdef Z3DEBUG inheritance).
        # Use a block comment (not //) so the closing } on the same line is not swallowed.
        p = pathlib.Path('src/math/lp/tail_matrix.h')
        if p.exists():
            t = p.read_text(errors='replace')
            new_t = t.replace('return m_A.get_elem(m_row, j);',
                              'return T(); /* stub: get_elem not declared on tail_matrix */')
            if new_t != t:
                p.write_text(new_t)
                print('Fixed tail_matrix.h broken get_elem debug call')
        "

        ## 5c. Fix m_low_bound typo in z3 4.8.x column_info.h.
        ##     The member is m_lower_bound; newer GCC rejects the wrong name in
        ##     a template body as an error rather than silently ignoring it.
        python3 -c "
        import pathlib
        p = pathlib.Path('src/math/lp/column_info.h')
        if p.exists():
            t = p.read_text(errors='replace')
            new_t = t.replace('c.m_low_bound', 'c.m_lower_bound')
            if new_t != t:
                p.write_text(new_t)
                print('Fixed m_low_bound typo in column_info.h')
        "

        ## 6. Re-encode any Latin-1 bytes in C++ source files to UTF-8.
        python3 -c "
        import os, pathlib
        n = 0
        for root, dirs, files in os.walk('.'):
            for fname in files:
                if fname.endswith(('.h', '.cpp', '.cc', '.c')):
                    p = pathlib.Path(root, fname)
                    try:
                        p.read_text()
                    except UnicodeDecodeError:
                        p.write_text(p.read_text(encoding='latin-1'))
                        n += 1
        print(f'Re-encoded {n} file(s) as UTF-8')
        "

        ## 7. Generate scripts/config-release.mk.
        ##    mk_make.py uses this file to set compiler flags instead of auto-detecting.
        ARCH_CMD="${{ matrix.arch_cmd }}"
        case "$(uname -s)" in
        Darwin)
            printf '%s\n' \
              "CC=clang" "PREFIX=/usr/local" "CXX=clang++" \
              "CXXFLAGS= -c -O2 -std=c++20 -D _EXTERNAL_RELEASE -D_NO_OMP_ -D_MP_INTERNAL ${STUB_INC} -fpermissive -Wno-c++11-extensions -fomit-frame-pointer -mmacosx-version-min=${{ matrix.macos_target }}" \
              'CXX_OUT_FLAG=-o' 'OBJ_EXT=.o' 'LIB_EXT=.a' \
              'AR=ar' 'AR_FLAGS=rcs' 'AR_OUTFLAG=' 'EXE_EXT=' \
              "LINK=clang++" "LINK_FLAGS=-mmacosx-version-min=${{ matrix.macos_target }}" \
              'LINK_OUT_FLAG=-o' 'LINK_EXTRA_FLAGS=-lpthread' \
              'SO_EXT=.dylib' 'SLINK=clang++' 'SLINK_FLAGS=-dynamiclib' \
              'SLINK_EXTRA_FLAGS=' 'SLINK_OUT_FLAG=-o' \
              > scripts/config-release.mk ;;
        *)
            printf '%s\n' \
              'CC=gcc' 'PREFIX=/usr/local' 'CXX=g++' \
              "CXXFLAGS= -c -O3 -std=c++2a -D _EXTERNAL_RELEASE -D_NO_OMP_ -D_MP_INTERNAL ${STUB_INC} -fpermissive -fomit-frame-pointer" \
              'CXX_OUT_FLAG=-o' 'OBJ_EXT=.o' 'LIB_EXT=.a' \
              'AR=ar' 'AR_FLAGS=rcs' 'AR_OUTFLAG=' 'EXE_EXT=' \
              'LINK=g++' 'LINK_FLAGS=-static-libstdc++ -static-libgcc' \
              'LINK_OUT_FLAG=-o' 'LINK_EXTRA_FLAGS=-lpthread -lrt' \
              'SO_EXT=.so' 'SLINK=g++' 'SLINK_FLAGS=-shared' \
              'SLINK_EXTRA_FLAGS=' 'SLINK_OUT_FLAG=-o' \
              > scripts/config-release.mk ;;
            ## Note: GCC 9 (ubuntu:20.04) uses -std=c++2a (the draft alias for
            ## c++20).  The Generate Makefile step also patches any -std=c++17
            ## injected by mk_make.py into the generated files to c++2a.
        esac
        echo "config-release.mk generated"
        cat scripts/config-release.mk

        ## 8. Detect whether the source requires C++20 <span> (not in GCC 9
        ##    libstdc++).  If so, use CMake; otherwise use the Python mk_make.py
        ##    build system.  This is version-agnostic: it inspects the source.
        if grep -rq '#include[[:space:]]*<span>' src/ 2>/dev/null; then
            echo "USE_CMAKE=true"  >> "$GITHUB_ENV"
            echo "Source uses <span> — will build with CMake"
        else
            echo "USE_CMAKE=false" >> "$GITHUB_ENV"
            echo "Source does not use <span> — will build with mk_make.py"
        fi

    ## ── Generate Makefile (mk_make.py path) ──────────────────────────────
    - name: Generate Z3 Makefile
      if: env.USE_CMAKE != 'true'
      run: |
        cd "z3-z3-${{ env.Z3_VERSION }}"
        ## mk_make.py generates a GNU Makefile using config-release.mk.
        set +e
        python3 -W ignore::SyntaxWarning scripts/mk_make.py > /tmp/mk_out.txt 2>&1
        ec=$?
        { grep -E "MKException|Failed to find|Error:|Traceback|raise " /tmp/mk_out.txt 2>/dev/null || true; \
          tail -5 /tmp/mk_out.txt; } | sort -u | while IFS= read -r line; do
            echo "::error file=scripts/mk_make.py::$line"
        done
        set -e
        ## Patch C++ standard in generated Makefile files.
        ## mk_make.py may hard-code -std=c++17 regardless of config-release.mk.
        ## Also strip -DZ3DEBUG to prevent debug-only broken code from compiling.
        if [ $ec -eq 0 ]; then
            if g++ --version 2>&1 | grep -q "^g++ .* 9\."; then
                CXX_STD="c++2a"
            else
                CXX_STD="c++20"
            fi
            python3 -c "
        import pathlib
        target = '${CXX_STD}'
        for p in pathlib.Path('build').glob('*'):
            if p.is_file() and (p.suffix in ('.mk', '.make') or p.name == 'Makefile'):
                t = p.read_text(errors='replace')
                new_t = t.replace('-std=c++17', '-std=' + target) \
                         .replace('-std=c++20', '-std=' + target) \
                         .replace('-DZ3DEBUG', '') \
                         .replace('-D Z3DEBUG', '')
                if new_t != t:
                    p.write_text(new_t)
                    print('Patched C++ standard to', target, 'in', p.name)
            "
        fi
        ## Remove x86-only SIMD flags on ARM64 — these cause a hard compiler error.
        if [ $ec -eq 0 ] && [ "$(uname -m)" = "aarch64" ]; then
            python3 -c "
        import pathlib, re
        flags = re.compile(r'-mfpmath=sse|-msse2|-msse(?!\d)')
        count = 0
        for p in pathlib.Path('build').glob('*'):
            if p.is_file() and (p.suffix in ('.mk', '.make') or p.name == 'Makefile'):
                t = p.read_text(errors='replace')
                new_t = flags.sub('', t)
                if new_t != t:
                    p.write_text(new_t)
                    count += 1
                    print('Stripped SSE flags from', p.name)
        print(f'Patched {count} file(s)')
            "
        fi
        exit $ec

    ## ── Configure with CMake (newer z3 that uses <span>) ────────────────────
    - name: Configure Z3 with CMake
      if: env.USE_CMAKE == 'true'
      run: |
        cd "z3-z3-${{ env.Z3_VERSION }}"
        CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DZ3_BUILD_LIBZ3_SHARED=OFF"
        case "$(uname -s)" in
        Darwin)
            ## cmake itself is an ARM64 binary on macos-14/15; running it via
            ## arch -x86_64 would fail.  Instead pass the target architecture
            ## as a cmake flag so the compiler produces x86_64 output.
            ## Also pin the deployment target to match the runner.
            ARCH_EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}"
            [ -n "${{ matrix.arch_cmd }}" ] && ARCH_EXTRA="$ARCH_EXTRA -DCMAKE_OSX_ARCHITECTURES=x86_64"
            cmake -B build $CMAKE_ARGS $ARCH_EXTRA
            ;;
        *)
            cmake -B build $CMAKE_ARGS
            ;;
        esac

    ## ── Build ──────────────────────────────────────────────────────────────
    - name: Build Z3
      run: |
        ARCH_CMD="${{ matrix.arch_cmd }}"
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
        set +e
        if [ "$USE_CMAKE" = "true" ]; then
            cmake --build "z3-z3-${{ env.Z3_VERSION }}/build" \
                -j"$JOBS" > /tmp/build_out.txt 2>&1
        else
            $ARCH_CMD make -j"$JOBS" -C "z3-z3-${{ env.Z3_VERSION }}/build" z3 > /tmp/build_out.txt 2>&1
        fi
        ec=$?
        grep -E "undefined reference|error:|ld returned|ld: error|CMake Error|FAILED:|Error 1$|Error 2$" \
            /tmp/build_out.txt | head -15 | while IFS= read -r line; do
            echo "::error::$line"
        done
        if [ $ec -ne 0 ]; then
            echo "=== build output: first errors ==="
            grep -m 20 "error:" /tmp/build_out.txt || true
            echo "=== build output: last 30 lines ==="
            tail -30 /tmp/build_out.txt
        fi
        set -e; exit $ec

    ## ── Verify ─────────────────────────────────────────────────────────────
    - name: Verify binary
      run: |
        binary="z3-z3-${{ env.Z3_VERSION }}/build/z3"
        ## For macOS x86_64 (Rosetta build) prepend arch -x86_64 when running.
        ARCH_CMD="${{ matrix.arch_cmd }}"

        echo "=== file type / size ==="
        file "$binary"
        ls -lh "$binary"

        echo "=== dynamic dependencies ==="
        if command -v ldd > /dev/null 2>&1; then
            ldd "$binary" || true
        elif command -v otool > /dev/null 2>&1; then
            otool -L "$binary"
        fi

        echo "=== z3 version ==="
        $ARCH_CMD "$binary" -version || echo "(z3 -version exited non-zero — continuing)"

        echo "=== smoke test: (check-sat) via temp file ==="
        ## The input file includes (exit) so Z3 terminates after check-sat.
        ## timeout is intentionally omitted: it cannot wrap a command that
        ## includes a variable prefix, and macOS may not have GNU timeout.
        tmp=$(mktemp /tmp/z3_smoke_XXXXXX.smt2)
        printf '(check-sat)\n(exit)\n' > "$tmp"
        smoke_out=$($ARCH_CMD "$binary" -smt2 "$tmp" 2>&1)
        ec=$?
        rm -f "$tmp"
        echo "$smoke_out"
        if [ $ec -ne 0 ] && ! echo "$smoke_out" | grep -q "^sat"; then
            echo "FAIL: z3 exited $ec and did not produce 'sat'"
            exit 1
        fi
        if echo "$smoke_out" | grep -q "^ERROR"; then
            echo "FAIL: z3 reported errors"
            exit 1
        fi
        if ! echo "$smoke_out" | grep -q "^sat"; then
            echo "FAIL: expected 'sat' in output, got: $smoke_out"
            exit 1
        fi
        echo "Smoke test passed"

    ## ── Publish ────────────────────────────────────────────────────────────
    - name: Upload asset to shared release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        asset="${{ steps.meta.outputs.asset_name }}"
        cp "z3-z3-${{ env.Z3_VERSION }}/build/z3" "$asset"
        gh release upload "${{ needs.prepare.outputs.tag }}" \
          --repo "${{ github.repository }}" \
          "${asset}#${asset}"

  ## ── Publish draft once all builds succeed ────────────────────────────────
  finalize:
    needs: [ prepare, build-z3 ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Publish release
      run: |
        gh release edit "${{ needs.prepare.outputs.tag }}" \
          --repo "${{ github.repository }}" \
          --draft=false
        echo "Published: ${{ needs.prepare.outputs.tag }}"
