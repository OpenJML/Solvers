name: 'Download solver binaries (one platform, nothing else)'
description: >-
  Sparse, shallow, blobless clone of this repository that fetches only one platform's own
  Solvers-<name> subdirectory -- no other platform's binaries, no git history beyond the single
  commit, and none of this repo's own build scripts/README/etc.  Meant to be called from other
  projects' own workflows (checkkt, jSMTLIB, OpenJML) as well as from workflows in this repo.

inputs:
  subdir:
    description: >-
      Which platform subdirectory to fetch: Solvers-linux, Solvers-linux-arm64, Solvers-macos,
      Solvers-macos-arm64, or Solvers-windows.
    required: true
  ref:
    description: 'Branch, tag, or commit of smtlib/Solvers to clone.'
    required: false
    default: master
  path:
    description: 'Where to clone the repo. The requested subdir ends up at <path>/<subdir>.'
    required: false
    default: Solvers

outputs:
  dir:
    description: 'Absolute path to the downloaded platform subdirectory.'
    value: ${{ steps.clone.outputs.dir }}

runs:
  using: composite
  steps:
    - id: clone
      shell: bash
      run: |
        # `git clone -b <ref>` only accepts a branch/tag name (it looks it up by name in the
        # remote's ref advertisement) -- it cannot take an arbitrary commit SHA, which `ref`
        # must support (e.g. a caller pinning to ${{ github.sha }} to test an exact commit).
        # `git fetch origin <ref>` accepts both a branch/tag name and a raw SHA (GitHub allows
        # fetching any reachable commit by SHA for public repos), so build the clone from a
        # bare init + fetch + checkout instead of `clone -b`.
        mkdir -p "${{ inputs.path }}"
        git -C "${{ inputs.path }}" init -q
        git -C "${{ inputs.path }}" remote add origin https://github.com/smtlib/Solvers
        git -C "${{ inputs.path }}" sparse-checkout init --cone
        git -C "${{ inputs.path }}" sparse-checkout set "${{ inputs.subdir }}"
        git -C "${{ inputs.path }}" fetch --depth 1 --filter=blob:none origin "${{ inputs.ref }}"
        git -C "${{ inputs.path }}" checkout FETCH_HEAD

        # A typo'd/nonexistent `subdir` doesn't make sparse-checkout or checkout themselves fail --
        # cone mode just matches nothing, silently leaving this directory missing or empty. Left
        # unchecked, that surfaces later as a confusing failure in whatever step first tries to use
        # a solver binary that was never actually downloaded, far from the actual cause. Fail here
        # instead, at the point where the real problem is known.
        if [ ! -d "${{ inputs.path }}/${{ inputs.subdir }}" ] || [ -z "$(ls -A "${{ inputs.path }}/${{ inputs.subdir }}" 2>/dev/null)" ]; then
          echo "::error::subdir '${{ inputs.subdir }}' not found (or empty) in smtlib/Solvers at ref '${{ inputs.ref }}'" >&2
          exit 1
        fi

        # Binaries are already committed executable (chmod +x) on Linux/macOS, but a sparse
        # checkout of a fresh clone has occasionally been seen to lose that bit in practice
        # elsewhere in this project family -- reapply it defensively. Meaningless (and skipped)
        # on Windows, which has no execute-permission bit.
        if [[ "${{ runner.os }}" != "Windows" ]]; then
          chmod +x "${{ inputs.path }}/${{ inputs.subdir }}"/* 2>/dev/null || true
        fi

        echo "dir=$GITHUB_WORKSPACE/${{ inputs.path }}/${{ inputs.subdir }}" >> "$GITHUB_OUTPUT"
